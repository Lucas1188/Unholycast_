name: Build and publish Docker image

on:
  push:
    branches: [master, range_fix]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Unholycast_/**'
      - 'Unholycast_.sln'
      - '.github/workflows/docker-publish.yml'
  schedule:
    - cron: '47 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-unholycast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Determine forced rebuild
        id: rebuild
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "forced=true" >> "$GITHUB_OUTPUT"
          else
            echo "forced=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/lucas1188/unholycast
          tags: |
            type=raw,value=dotnet
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: ${{ steps.rebuild.outputs.forced == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
